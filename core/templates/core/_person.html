{% load i18n sitetags %}<a class="pm" href="{{ m.get_absolute_url }}" data-person="{{ m.slug }}"><span class="pm__pic">{% if m.photo %}<img{% if m.photo_has_band %} class="pm__crop"{% endif %} src="{{ m.photo.url }}" alt="" loading="lazy" width="200" height="267">{% endif %}</span><b>{{ m.display_name }}</b><span class="pm__role">{{ m|tr:"role" }}</span>{% if not compact %}<span class="pm__dept">{{ m.get_dept_display }}</span>{% if m.cert_count %}<small class="pm__cert">{% blocktranslate with n=m.cert_count %}{{ n }} ta sertifikat{% endblocktranslate %}</small>{% endif %}{% endif %}</a>
