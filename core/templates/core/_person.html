{% load sitetags %}<article class="pm" data-person="{{ m.pk }}"><span class="pm__pic">{% if m.photo %}<img class="pm__crop" src="{{ m.photo.url }}" alt="{{ m.display_name }}" loading="lazy" width="200" height="267">{% endif %}</span><b>{{ m.display_name }}</b><span class="pm__role">{{ m|tr:"role" }}</span>{% if not compact and m.certificate_lines %}<small class="pm__cert">{{ m.certificate_lines|join:"; " }}</small>{% endif %}</article>
